services:
  streamer:
    build: .
    container_name: ws-streamer
    restart: unless-stopped
    env_file:
      - ../.env
    user: "1000:1000"
    ipc: host
    devices:
      - /dev/dri:/dev/dri
    group_add:
      - "983"
      - "984"
      - "987"
      - "988"
    ports:
      - "8080:8080"
    environment:
      - XDG_RUNTIME_DIR=/run/user/1000
      - DBUS_SESSION_BUS_ADDRESS=unix:path=/run/user/1000/bus
      - PULSE_SERVER=unix:/run/user/1000/pulse/native
      - PIPEWIRE_RUNTIME_DIR=/run/user/1000
      - LIBVA_DRIVER_NAME=${LIBVA_DRIVER_NAME:-radeonsi}
      - PORT=8080
      - FRAMERATE=${FRAMERATE:-60}
      - TARGET_WIDTH=${TARGET_WIDTH:-1920}
      - TARGET_HEIGHT=${TARGET_HEIGHT:-1080}
      - VIDEO_BITRATE=${VIDEO_BITRATE:-6000k}
      - ENCODER=${ENCODER:-gpu}
      - CPU_THREADS=${CPU_THREADS:-4}
      - AUDIO_ROUTING=${AUDIO_ROUTING:-true}
      - AUDIO_SOURCE=${AUDIO_SOURCE:-stream_sink.monitor}
      - AUDIO_BLACKLIST=${AUDIO_BLACKLIST:-discord,Discord,vesktop,webcord,slack,zoom,teams,webrtc,WEBRTC}
      - INCLUDE_MIC=${INCLUDE_MIC:-false}
    volumes:
      - /run/user/1000/bus:/run/user/1000/bus
      - /run/user/1000/pipewire-0:/run/user/1000/pipewire-0
      - /run/user/1000/pulse:/run/user/1000/pulse
      - ./web:/home/streamer/web:ro

  tunnel:
    image: cloudflare/cloudflared:latest
    container_name: ws-cloudflared
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN}
    command: tunnel --no-autoupdate run
    depends_on:
      - streamer
