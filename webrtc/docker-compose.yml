services:
  streamer:
    build: .
    container_name: webrtc-streamer
    restart: unless-stopped
    env_file:
      - ../.env
    user: "1000:1000"
    ipc: host
    ports:
      - "8080:8080"
      - "50000-50050:50000-50050/udp"
    environment:
      - XDG_RUNTIME_DIR=/run/user/1000
      - DBUS_SESSION_BUS_ADDRESS=unix:path=/run/user/1000/bus
      - PULSE_SERVER=unix:/run/user/1000/pulse/native
      - PIPEWIRE_RUNTIME_DIR=/run/user/1000
      - PORT=8080
      - FRAMERATE=${FRAMERATE:-60}
      - VIDEO_BITRATE=${VIDEO_BITRATE:-6000k}
      - AUDIO_BLACKLIST=${AUDIO_BLACKLIST:-discord,Discord,vesktop,webcord,slack,zoom,teams}
      - INCLUDE_MIC=${INCLUDE_MIC:-false}
      - STUN_SERVERS=${STUN_SERVERS:-stun:stun.l.google.com:19302,stun:stun1.l.google.com:19302,stun:stun2.l.google.com:19302}
    volumes:
      - /run/user/1000/bus:/run/user/1000/bus
      - /run/user/1000/pipewire-0:/run/user/1000/pipewire-0
      - /run/user/1000/pulse:/run/user/1000/pulse

  tunnel:
    image: cloudflare/cloudflared:latest
    container_name: webrtc-cloudflared
    restart: unless-stopped
    env_file:
      - ../.env
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      - streamer
