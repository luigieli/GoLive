<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>⚡ Live WebRTC Screen Stream (&lt;150ms)</title>
    <style>
        :root {
            --bg-primary: #0a0c10;
            --bg-card: rgba(18, 22, 34, 0.85);
            --accent-cyan: #00e5ff;
            --accent-green: #00e676;
            --text-primary: #f0f4f8;
            --text-secondary: #8c9ba5;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-primary);
            color: var(--text-primary);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 1300px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 8px 16px;
            background: var(--bg-card);
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(16px);
        }

        .title-group {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .live-badge {
            display: flex;
            align-items: center;
            gap: 6px;
            background: rgba(0, 230, 118, 0.15);
            color: var(--accent-green);
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 600;
            border: 1px solid rgba(0, 230, 118, 0.3);
        }

        .live-dot {
            width: 8px;
            height: 8px;
            background-color: var(--accent-green);
            border-radius: 50%;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.4; transform: scale(0.85); }
            100% { opacity: 1; transform: scale(1); }
        }

        .stats-badge {
            background: rgba(0, 229, 255, 0.1);
            color: var(--accent-cyan);
            padding: 4px 12px;
            border-radius: 8px;
            font-size: 0.85rem;
            font-family: monospace;
            border: 1px solid rgba(0, 229, 255, 0.2);
        }

        .video-wrapper {
            position: relative;
            width: 100%;
            aspect-ratio: 16 / 9;
            background: #000;
            border-radius: 16px;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.8);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        video {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .overlay-msg {
            position: absolute;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            color: var(--text-secondary);
            font-size: 1.1rem;
            pointer-events: none;
        }

        .spinner {
            width: 44px;
            height: 44px;
            border: 3px solid rgba(255, 255, 255, 0.1);
            border-radius: 50%;
            border-top-color: var(--accent-cyan);
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .controls {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: var(--bg-card);
            padding: 12px 20px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        .btn-group {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        button {
            background: rgba(255, 255, 255, 0.08);
            color: var(--text-primary);
            border: 1px solid rgba(255, 255, 255, 0.15);
            padding: 8px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 500;
            font-size: 0.9rem;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        button:hover {
            background: rgba(255, 255, 255, 0.15);
            border-color: var(--accent-cyan);
        }

        .unmute-banner {
            position: absolute;
            bottom: 24px;
            background: rgba(0, 229, 255, 0.9);
            color: #000;
            font-weight: 600;
            padding: 10px 20px;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 8px 25px rgba(0, 229, 255, 0.4);
            transition: transform 0.2s ease;
        }

        .unmute-banner:hover {
            transform: scale(1.05);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="title-group">
                <h2>🖥️ Live Screen & Audio</h2>
                <div class="live-badge" id="liveBadge">
                    <span class="live-dot"></span>
                    <span id="statusText">Connecting WebRTC...</span>
                </div>
            </div>
            <div class="stats-badge" id="statsText">Latency: &lt;100ms | WebRTC</div>
        </div>

        <div class="video-wrapper">
            <video id="remoteVideo" autoplay playsinline muted></video>
            <div class="overlay-msg" id="loadingOverlay">
                <div class="spinner"></div>
                <span>Negotiating Ultra-Low Latency PeerConnection...</span>
            </div>
            <div class="unmute-banner" id="unmuteBanner" style="display: none;">
                🔊 Click to Unmute Audio
            </div>
        </div>

        <div class="controls">
            <div class="btn-group">
                <button id="toggleAudioBtn">🔊 Unmute</button>
                <button id="reconnectBtn">🔄 Reconnect</button>
            </div>
            <div class="btn-group">
                <button id="fullscreenBtn">⛶ Fullscreen</button>
            </div>
        </div>
    </div>

    <script>
        const video = document.getElementById('remoteVideo');
        const statusText = document.getElementById('statusText');
        const statsText = document.getElementById('statsText');
        const loadingOverlay = document.getElementById('loadingOverlay');
        const unmuteBanner = document.getElementById('unmuteBanner');
        const toggleAudioBtn = document.getElementById('toggleAudioBtn');
        const reconnectBtn = document.getElementById('reconnectBtn');
        const fullscreenBtn = document.getElementById('fullscreenBtn');

        let pc = null;

        async function startWebRTC() {
            if (pc) {
                pc.close();
            }

            loadingOverlay.style.display = 'flex';
            statusText.innerText = 'Connecting...';

            pc = new RTCPeerConnection({
                iceServers: [
                    { urls: 'stun:stun.l.google.com:19302' },
                    { urls: 'stun:stun1.l.google.com:19302' }
                ]
            });

            pc.ontrack = (event) => {
                if (video.srcObject !== event.streams[0]) {
                    video.srcObject = event.streams[0];
                    loadingOverlay.style.display = 'none';
                    statusText.innerText = 'LIVE (WebRTC)';
                }
            };

            pc.onconnectionstatechange = () => {
                if (pc.connectionState === 'connected') {
                    statusText.innerText = 'LIVE (WebRTC)';
                    loadingOverlay.style.display = 'none';
                } else if (pc.connectionState === 'failed' || pc.connectionState === 'disconnected') {
                    statusText.innerText = 'Disconnected';
                    setTimeout(startWebRTC, 2000);
                }
            };

            // Request Video and Audio Transceivers
            pc.addTransceiver('video', { direction: 'recvonly' });
            pc.addTransceiver('audio', { direction: 'recvonly' });

            const offer = await pc.createOffer();
            await pc.setLocalDescription(offer);

            try {
                const res = await fetch('/api/webrtc/offer', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ sdp: offer.sdp, type: offer.type })
                });

                if (!res.ok) {
                    throw new Error(`Server returned ${res.status}`);
                }

                const answer = await res.json();
                await pc.setRemoteDescription(new RTCSessionDescription(answer));
            } catch (err) {
                console.error('[WebRTC] Signaling error:', err);
                statusText.innerText = 'Signaling Error (Retrying...)';
                setTimeout(startWebRTC, 3000);
            }
        }

        // Audio controls
        function toggleAudio() {
            video.muted = !video.muted;
            if (video.muted) {
                toggleAudioBtn.innerText = '🔇 Muted (Click to Unmute)';
                unmuteBanner.style.display = 'block';
            } else {
                toggleAudioBtn.innerText = '🔊 Audio Playing';
                unmuteBanner.style.display = 'none';
            }
        }

        toggleAudioBtn.onclick = toggleAudio;
        unmuteBanner.onclick = () => {
            video.muted = false;
            toggleAudioBtn.innerText = '🔊 Audio Playing';
            unmuteBanner.style.display = 'none';
        };

        video.onplay = () => {
            if (video.muted) {
                unmuteBanner.style.display = 'block';
            }
        };

        reconnectBtn.onclick = startWebRTC;

        fullscreenBtn.onclick = () => {
            if (!document.fullscreenElement) {
                video.requestFullscreen().catch(err => alert(err.message));
            } else {
                document.exitFullscreen();
            }
        };

        // Start WebRTC on load
        startWebRTC();
    </script>
</body>
</html>
